name: Node Quality

# Workflow reutilizável para frontend React/Vite (com package.json).
#   uses: vitahubdev/quality-workflows/.github/workflows/node-quality.yml@v1
#
# Roda: Biome (lint + format, config DO PROJETO), tsc (tipagem), npm audit (CVE).

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: 'frontend'
        description: 'Pasta com o package.json.'
      node-version:
        type: string
        default: '22'
      config-ref:
        type: string
        default: 'v1'
        description: 'Tag/branch do quality-workflows de onde baixar as configs.'
      audit-level:
        type: string
        default: 'high'
        description: 'Nível mínimo que falha o npm audit: low | moderate | high | critical.'
      biome-version:
        type: string
        default: '2.5.4'
        description: >
          Versão EXATA do Biome. Tem de ser a mesma da rev do hook biomejs/pre-commit
          e do $schema dos biome.json do projeto — é o que garante local == CI.
          Existe como input para o projeto que sobe o Biome poder casar as duas
          pontas SEM mover a tag compartilhada deste repositório.
    # 🔴 HeroUI Pro (24/09/2026, vita-track SPRINT-03 E01). O `@heroui-pro/react` do
    # npm é só um baixador: os componentes chegam por um `postinstall` que exige
    # credencial, e sem ela o `npm ci` MORRE antes de Biome e tsc (medido no
    # beesaude em 31/08/2026). Segredo de org NÃO chega sozinho a workflow
    # reutilizável: o chamador passa pelo nome e o passo tem de referenciá-lo
    # (docs.github.com, "Reuse workflows" e `on.workflow_call.secrets`, lidos em
    # 24/09/2026). Opcional: quem não usa HeroUI Pro não passa nada e a variável
    # fica vazia — com ela vazia o postinstall não recusa (medido no beesaude em
    # 30/08/2026).
    # ⚠️ Token de CI/CD do dashboard do HeroUI, NUNCA o pessoal.
    secrets:
      HEROUI_AUTH_TOKEN:
        required: false
        description: 'Token de CI/CD do HeroUI Pro, para o postinstall do @heroui-pro/react.'

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install
        working-directory: ${{ inputs.working-directory }}
        run: npm ci --no-audit --no-fund
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}

      # ── Biome: lint + format (config DO PROJETO, auto-descoberta) ──
      # Monorepo: biome.json "root" na raiz + frontend/biome.json "root": false.
      #
      # ⚠️ VERSÃO PINADA, nunca `npx @biomejs/biome` sem `@versão`. Sem o pin, o npx
      # instala a LATEST: o CI divergia do pre-commit (que fixa a rev) e do $schema
      # dos biome.json, e — pior — passava a reprovar sozinho no dia em que o Biome
      # publicasse regra nova, em todos os projetos de uma vez, sem ninguém ter
      # tocado em nada. É o oposto da política de versão exata deste manual.
      - name: Biome
        run: npx --yes @biomejs/biome@${{ inputs.biome-version }} ci ${{ inputs.working-directory }}

      # ── TypeScript: tipagem ──────────────────────
      - name: TypeScript
        working-directory: ${{ inputs.working-directory }}
        run: npx tsc --noEmit

      # ── npm audit: CVE em dependências ───────────
      - name: npm audit
        working-directory: ${{ inputs.working-directory }}
        continue-on-error: true
        run: npm audit --audit-level=${{ inputs.audit-level }}
