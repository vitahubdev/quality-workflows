name: Static Quality

# Workflow reutilizável para frontend vanilla (HTML/CSS/JS puro, SEM package.json).
#   uses: vitahubdev/quality-workflows/.github/workflows/static-quality.yml@v1
#
# Só Biome (config DO PROJETO) — não há dependências nem TypeScript.

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: 'frontend'
      node-version:
        type: string
        default: '22'
      config-ref:
        type: string
        default: 'v1'
      biome-version:
        type: string
        default: '2.5.4'
        description: >
          Versão EXATA do Biome. Tem de ser a mesma da rev do hook biomejs/pre-commit
          e do $schema dos biome.json do projeto — é o que garante local == CI.
          Existe como input para o projeto que sobe o Biome poder casar as duas
          pontas SEM mover a tag compartilhada deste repositório.

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      # Biome usa a config DO PROJETO (biome.json na raiz do projeto vanilla).
      #
      # ⚠️ VERSÃO PINADA, nunca `npx @biomejs/biome` sem `@versão`. Sem o pin, o npx
      # instala a LATEST: o CI divergia do pre-commit (que fixa a rev) e do $schema
      # dos biome.json, e — pior — passava a reprovar sozinho no dia em que o Biome
      # publicasse regra nova, em todos os projetos de uma vez, sem ninguém ter
      # tocado em nada. É o oposto da política de versão exata deste manual.
      - name: Biome
        run: npx --yes @biomejs/biome@${{ inputs.biome-version }} ci ${{ inputs.working-directory }}
